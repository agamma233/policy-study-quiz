function config(m,p=''){mode=m;switchTo('config');const exam=m==='模拟考试',full=exam||m==='套卷练习',rand=m==='随机刷题';app.innerHTML=`<h1>${m}</h1><article><div class="grid"><label class="field">试卷<select id="p">${opts([...(full?[]:[['','全部试卷']]),...pf],p)}</select></label>${!full?`<label class="field">题型<select id="k">${opts([...(m==='专项练习'?[]:[['','全部题型']]),...kf])}</select></label>`:''}${rand?`<label class="field">题量<select id="limit">${opts([10,20,30,50,100,9999].map(n=>[n,n===9999?'全部':n+' 题']))}</select></label>`:''}${exam?'<label class="field">考试时长（分钟）<input id="minutes" type="number" min="1" max="600" value="60"></label>':''}</div><p id="rule"></p>${!exam?[['un','仅练未掌握题目'],...(!full?[['dedup','去除重复题目']]:[]),...(rand?[['mix','打乱题目顺序'],['mixO','打乱选项顺序'],['prior','历史错题优先']]:[])].map(([id,l])=>`<label class="check"><input type="checkbox" id="${id}" ${id==='mix'?'checked':''}>${l}</label>`).join(''):''}<p>${btn(exam?'开始考试':'开始练习','start','','primary')}</p></article>`;rule()}

function normalize(v){let t=String(v??'').normalize('NFKC').toLowerCase().trim().replace(/[‐‑–—－~～至]/g,'-').replace(/(?<=\d),(?=\d{3}(?:\D|$))/g,'').replace(/[\s、，,。；;：:“”"'（）()！!？?]/g,'');t=t.replace(/(\d+(?:\.\d+)?)万/g,(_,n)=>String(Number(n)*10000));t=t.replace(/([零〇一二两三四五六七八九十百千万]+)/g,(s)=>{if(!/[十百千万]/.test(s))return [...s].map(x=>'零一二三四五六七八九'.indexOf(x.replace('〇','零').replace('两','二'))).join('');let total=0,part=0,n=0;for(let c of s){let unit={十:10,百:100,千:1000,万:10000}[c];if(unit===10000){total+=(part+n||1)*unit;part=n=0}else if(unit){part+=(n||1)*unit;n=0}else n='零一二三四五六七八九'.indexOf(c.replace('两','二').replace('〇','零'))}return total+part+n});return t.replace(/(\d+(?:\.\d+)?)/g,x=>String(Number(x))).replace(/个月/g,'月').replace(/天/g,'日').replace(/医疗保险/g,'医保').replace(/授权承诺/g,'援权承诺')}
function blankOK(q,i,v){let a=normalize(q.a[i]),b=normalize(v);return !!b&&(a===b||(/^\d+(\.\d+)?$/.test(a)&&['元','人','户','日','月','次','%','万元','平方米','棵','人/月','个百分点','万'].some(u=>q.s.split('▢')[i+1]?.trim().startsWith(u)&&b===a+u)))}

const plain=x=>x&&typeof x==='object'&&!Array.isArray(x),finite=n=>typeof n==='number'&&Number.isFinite(n),safeID=x=>typeof x==='string'&&/^[\w-]{1,100}$/.test(x)&&!['__proto__','prototype','constructor'].includes(x);
function validate(d){function check(c){if(!c)throw Error('备份格式或记录内容有误')}check(plain(d)&&d.version===1&&['sessions','events','favorites','master','settings'].every(k=>plain(d[k])));const known=id=>M.has(id),ans=x=>Array.isArray(x)&&x.every(v=>v===null||typeof v==='string');for(let [id,e] of Object.entries(d.events)){check(safeID(id)&&e.id===id&&known(e.q)&&finite(e.t)&&finite(e.score)&&typeof e.ok==='boolean'&&ans(e.ans))}for(let k of ['favorites','master'])for(let [id,x] of Object.entries(d[k]))check(known(id)&&typeof x.on==='boolean'&&finite(x.t));for(let [id,s] of Object.entries(d.sessions)){check(safeID(id)&&id===s.id&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(known)&&Number.isInteger(s.i)&&s.i>=0&&s.i<s.ids.length&&typeof s.mode==='string'&&[s.p,s.start,s.updated,s.used,s.deadline,s.minutes,s.done].every(finite)&&['draft','scores','order'].every(k=>plain(s[k])));for(let [qid,x] of Object.entries(s.draft))check(s.ids.includes(qid)&&ans(x));for(let [qid,x] of Object.entries(s.scores))check(s.ids.includes(qid)&&plain(x)&&(x.score===null||(finite(x.score)&&x.score>=0&&x.score<=M.get(qid).v&&safeID(x.event)&&d.events[x.event]?.q===qid)));for(let qid of s.ids){let q=M.get(qid);if(q.o){let o=s.order[qid];check(Array.isArray(o)&&o.length===q.o.length&&[...o].sort().join()===q.o.map((_,i)=>i).join())}}}check(!d.active||Object.hasOwn(d.sessions,d.active));check(['light','dark','system'].includes(d.settings.theme)&&[16,18,19,20,22,24,28].includes(d.settings.size)&&typeof d.settings.auto==='boolean');return d}
function merge(a,b){let out={...a};for(let key of ['events','sessions','favorites','master']){out[key]={...a[key]};for(let [id,x] of Object.entries(b[key])){let old=out[key][id];if(!old||(x.updated||x.t)>=(old.updated||old.t))out[key][id]=x}}out.active=Object.values(out.sessions).filter(s=>!s.done).sort((x,y)=>y.updated-x.updated)[0]?.id||'';return out}

async function deviceCheck(){
 const output=document.getElementById('deviceOutput');
 if(!output)return;
 const trigger=document.querySelector('[data-do="device"]');
 trigger.disabled=true;output.textContent='正在检查页面布局和交互…';
 const lines=[];
 for(const width of [320,390,768,1280]){
  const frame=document.createElement('iframe'),token=uid();
  frame.setAttribute('sandbox','allow-scripts');
  frame.tabIndex=-1;frame.title='布局测试';frame.style.cssText='position:fixed;left:-20000px;top:0;height:800px;border:0;pointer-events:none;width:'+width+'px';
  const result=new Promise(resolve=>{
   let timer;
   function finish(e){if(e.source===frame.contentWindow&&e.data?.token===token){clearTimeout(timer);window.removeEventListener('message',finish);resolve(e.data.text)}}
   window.addEventListener('message',finish);timer=setTimeout(()=>{window.removeEventListener('message',finish);resolve('检查超时')},10000)
  });
  const test=`requestAnimationFrame(()=>{try{
   const fit=()=>{if(document.documentElement.scrollWidth>innerWidth)throw Error('页面横向溢出')};
   fit();let seed=Q.filter(q=>q.p===8);createSession(seed,'模拟考试',8,60);
   if(document.querySelector('.feedback,.option.ok,.option.bad'))throw Error('考中反馈提前显示');
   document.querySelector('[data-do=choose][data-v=C]').click();document.querySelector('[data-do=submit]').click();
   if(session().draft[seed[0].id][0]!=='C')throw Error('选择保存失败');
   sheet();if(!dlg.open)throw Error('答题卡打开失败');document.querySelector('[data-do=jump][data-v="63"]').click();
   const input=document.querySelector('textarea');input.value='测试回答';input.dispatchEvent(new Event('input',{bubbles:true}));fit();
   seal(session(),false);report();fit();jump(63);document.querySelector('#self').value='8';document.querySelector('[data-do=grade]').click();
   if(totals(session())!==9)throw Error('主观题自评失败');D.settings.theme='dark';theme();if(document.documentElement.dataset.theme!=='dark')throw Error('主题切换失败');
   fit();parent.postMessage({token:${JSON.stringify(token)},text:innerWidth+' px　通过（首页、案例、报告、答题卡、评分及深色主题）'},'*')
  }catch(e){parent.postMessage({token:${JSON.stringify(token)},text:'失败：'+e.message},'*')}})`;
  const closeScript='</scr'+'ipt>',scripts=Array.from(document.scripts),appCode=scripts[scripts.length-1].textContent;
  frame.srcdoc='<!doctype html><meta charset="utf-8"><style>'+document.querySelector('style').textContent+'</style><header><div><span class="brand">政策学习室</span><button>首页</button><button>设置</button></div></header><div id="failure"></div><main id="app"></main><aside id="bar"></aside><dialog id="dlg"></dialog><div id="toast"></div><input type="file" id="file" hidden><script id="bank" type="application/json">'+document.querySelector('#bank').textContent+closeScript+'<script>'+appCode.replaceAll('localStorage.getItem','testStorage.getItem').replaceAll('localStorage.setItem','testStorage.setItem').replace("'use strict';","'use strict';const testStorage={getItem:()=>null,setItem:()=>{}};")+'\n'+test+closeScript;
  document.body.append(frame);lines.push(await result);frame.remove();output.textContent=lines.join('\n')
 }
 trigger.disabled=false
